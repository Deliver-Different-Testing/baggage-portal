# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# NOTE: BaggageDelivery exposes only /healthz (Program.cs MapHealthChecks).
# All probes point at /healthz — there is no /health/live endpoint.
replicaCount: 1

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 85
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

ingress:
  tls:
    enabled: true
  annotations:
    kubernetes.io/tls-acme: "true"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "32m"
  modSecurity:
    enabled: false
    secRuleEngine: "DetectionOnly"
service:
  externalPort: 5000
  internalPort: 8080
  url: ""

startupProbe:
  enabled: true
  path: "/healthz"
  probeType: "httpGet"
  scheme: "HTTP"
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 15
livenessProbe:
  path: "/healthz"
  initialDelaySeconds: 30
  timeoutSeconds: 15
  failureThreshold: 5
  scheme: "HTTP"
  probeType: "httpGet"
readinessProbe:
  path: "/healthz"
  initialDelaySeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  scheme: "HTTP"
  probeType: "httpGet"

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 10"]
